vhosts:
     - server_name: www.domain.tld
       document_root: /www/domain
       server_admin: www-admin@foo.example.com
       port: 80
       directory:
          path: /usr/local/httpd/htdocs
          allow_override: All
          options: Indexes FollowSymLinks
          order: allow,deny
          allow: from all
          
